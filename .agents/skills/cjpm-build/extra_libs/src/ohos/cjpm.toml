[package]
  cjc-version = "0.48.2"
  name = "ohos"
  description = "Cangjie ArkTS interop library"
  version = "1.0.0"
  output-type = "dynamic"
  compile-option = ""
  link-option = "-lark_interop -lutf16string -lcj_bind_ffi -lark_interop_helper_ffi"
  src-dir = "."
  target-dir = ""

  [package.package-configuration."ohos.labels"]
    output-type = "dynamic"
  [package.package-configuration."ohos.business_exception"]
    output-type = "dynamic"
  [package.package-configuration."ohos.ffi"]
    output-type = "dynamic"
  [package.package-configuration."ohos.encoding.json"]
    output-type = "dynamic"
  [package.package-configuration."ohos.callback_invoke"]
    output-type = "dynamic"
  [package.package-configuration."ohos.ark_interop"]
    compile-option = "-lark_interop.z -L${ProjectRoot}/skills/cjpm-build/extra_libs/aarch64-linux-ohos -lutf16string.z -L${ProjectRoot}/skills/cjpm-build/extra_libs/aarch64-linux-ohos"
    output-type = "dynamic"
  [package.package-configuration."ohos.ark_interop_helper"]
    output-type = "dynamic"
[target.aarch64-linux-ohos]
    compile-option = "-B\"${ProjectRoot}/skills/cjpm-build/extra_libs/aarch64-linux-ohos\" -L\"${ProjectRoot}/skills/cjpm-build/extra_libs/aarch64-linux-ohos\""
[target.aarch64-linux-ohos.bin-dependencies]
    path-option = ["${SDK_HOME}/cangjie/api/lib/linux_ohos_aarch64_cjnative/ohos"]
[profile]
  [profile.build]
    incremental = true
  [profile.customized-option]
    debug = "-g -Woff all"
    release = "--fast-math -O2 -Woff all"
